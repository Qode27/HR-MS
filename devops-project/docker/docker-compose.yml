# -----------------------------------------------------------------------------
# PeopleFlow HR - local 3-tier stack
#
#   Tier 1  Web / edge      : proxy   (NGINX, the only service exposed to you)
#   Tier 2  Application     : app     (Next.js UI + API routes)  + migrate job
#   Tier 3  Data            : db      (PostgreSQL 16)
#
# Usage (from devops-project/docker):
#   cp .env.compose.example .env.compose   # then edit the passwords
#   docker compose --env-file .env.compose up --build -d
#   docker compose --env-file .env.compose run --rm migrate npx tsx prisma/seed.ts
#   open http://localhost:8080
# -----------------------------------------------------------------------------
name: peopleflow

x-app-env: &app-env
  NODE_ENV: production
  NEXT_PUBLIC_APP_NAME: "PeopleFlow HR"
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
  DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
  JWT_SECRET: ${JWT_SECRET}

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: devops-project/docker/Dockerfile
      target: runner
      args:
        APP_VERSION: local
    image: peopleflow-web:local
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [frontend, backend]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: devops-project/docker/Dockerfile
      target: migrator
    image: peopleflow-migrator:local
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"   # local admin tools only; never public
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

networks:
  frontend: {}
  backend:
    internal: true   # the data tier has no route to the internet

volumes:
  pgdata: {}
