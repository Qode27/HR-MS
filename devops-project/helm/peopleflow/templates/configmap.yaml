apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "peopleflow.fullname" . }}-config
  labels:
    {{- include "peopleflow.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  APP_VERSION: {{ (default .Chart.AppVersion .Values.image.tag) | quote }}
