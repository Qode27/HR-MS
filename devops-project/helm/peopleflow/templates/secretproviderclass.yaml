{{- if .Values.secrets.keyVault.enabled }}
# Azure Key Vault -> mounted files + a synced Kubernetes Secret (Day 12).
# Auth uses Workload Identity: the service account's federated identity
# must have the "Key Vault Secrets User" role on the vault (Terraform does this).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "peopleflow.fullname" . }}-kv
  labels:
    {{- include "peopleflow.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "secrets.keyVault.name is required" .Values.secrets.keyVault.name | quote }}
    tenantId: {{ required "secrets.keyVault.tenantId is required" .Values.secrets.keyVault.tenantId | quote }}
    objects: |
      array:
      {{- range $kvName, $envName := .Values.secrets.keyVault.objects }}
        - |
          objectName: {{ $kvName }}
          objectType: secret
      {{- end }}
  secretObjects:
    - secretName: {{ .Values.secrets.name }}
      type: Opaque
      data:
        {{- range $kvName, $envName := .Values.secrets.keyVault.objects }}
        - objectName: {{ $kvName }}
          key: {{ $envName }}
        {{- end }}
{{- end }}
