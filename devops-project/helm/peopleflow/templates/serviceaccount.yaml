{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "peopleflow.serviceAccountName" . }}
  labels:
    {{- include "peopleflow.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.workloadIdentityClientId }}
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
