{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller may reach the web pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "peopleflow.fullname" . }}-web
  labels:
    {{- include "peopleflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "peopleflow.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
{{- end }}
