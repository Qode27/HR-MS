{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "peopleflow.fullname" . }}-web
  labels:
    {{- include "peopleflow.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "peopleflow.selectorLabels" . | nindent 6 }}
{{- end }}
