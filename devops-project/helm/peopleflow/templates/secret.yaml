{{- if and .Values.secrets.create (not .Values.secrets.keyVault.enabled) }}
# LOCAL LABS ONLY. In Azure the Secret is synced from Key Vault.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "peopleflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
