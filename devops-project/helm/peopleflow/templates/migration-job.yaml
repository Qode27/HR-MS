{{- if .Values.migration.enabled }}
# Database migrations (Prisma) run as a Helm hook:
#  - post-install : first install, after the Secret/ServiceAccount exist
#  - pre-upgrade  : every later release, BEFORE new pods roll out
# If the migration fails, the release fails and `helm --atomic` rolls back.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "peopleflow.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "peopleflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "peopleflow.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
        {{- include "peopleflow.workloadIdentityLabel" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "peopleflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "peopleflow.migrationImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "peopleflow.kvVolumeMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "peopleflow.kvVolume" . | nindent 8 }}
{{- end }}
