# Local Kubernetes cluster for the labs: 1 control plane + 2 workers.
# Ports 80/443 on your machine go to the ingress controller.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: peopleflow
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    labels:
      tier: app
  - role: worker
    labels:
      tier: app
