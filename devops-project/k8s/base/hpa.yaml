# Needs metrics-server (kind: see LAB-GUIDE Lab 10). AKS includes it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: peopleflow-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: peopleflow-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
