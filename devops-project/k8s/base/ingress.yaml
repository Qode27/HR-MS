# Tier 1 (edge): the ingress controller replaces the NGINX container from compose.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: peopleflow-web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: peopleflow.localtest.me     # resolves to 127.0.0.1 - no hosts file edit
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: peopleflow-web
                port:
                  name: http
