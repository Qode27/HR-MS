# gitleaks config: default rules + project-specific ones.
#   gitleaks dir . --config devops-project/security/.gitleaks.toml     (working tree)
#   gitleaks git . --config devops-project/security/.gitleaks.toml     (full history)
title = "peopleflow"

[extend]
useDefault = true

[[rules]]
id = "postgres-url-with-password"
description = "PostgreSQL connection string with an inline password"
regex = '''postgres(?:ql)?://[^:\s"']+:([^@\s"']{6,})@[^\s"']+'''
secretGroup = 1
keywords = ["postgres://", "postgresql://"]

[[rules]]
id = "jwt-secret-assignment"
description = "JWT_SECRET assigned a literal value"
regex = '''JWT_SECRET\s*[=:]\s*["']?([A-Za-z0-9+/=_\-]{16,})'''
secretGroup = 1
keywords = ["JWT_SECRET"]

[allowlist]
description = "Known lab-only placeholders and generated folders"
paths = [
  '''node_modules/''',
  '''\.next/''',
  '''package-lock\.json''',
]
regexes = [
  '''change-me''',
  '''local-lab-password''',
  '''<[a-z\- ]+>''',
  '''\$\{?POSTGRES_PASSWORD\}?''',
  '''build:build@''',
  '''user:pass@''',
]
